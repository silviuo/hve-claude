name: Sync from microsoft/hve-core

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v4

      - name: Clone upstream hve-core
        run: git clone --depth 1 https://github.com/microsoft/hve-core.git /tmp/hve-core

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Regenerate plugin content
        run: python tools/convert_hve.py /tmp/hve-core --target plugin

      - name: Commit and push if changed
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No upstream changes."
            exit 0
          fi
          # Claude Code's plugin cache is keyed by version: if content changed but
          # the version did not, bump the patch so installs actually update.
          OLD_VERSION=$(git show HEAD:.claude-plugin/plugin.json | python -c "import json,sys;print(json.load(sys.stdin)['version'])")
          NEW_VERSION=$(python -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          if [ "$NEW_VERSION" = "$OLD_VERSION" ]; then
            python - <<'EOF'
          import json
          p = ".claude-plugin/plugin.json"
          m = json.load(open(p, encoding="utf-8"))
          a, b, c = (m["version"].split("-")[0].split("."))
          m["version"] = f"{a}.{b}.{int(c) + 1}"
          open(p, "w", encoding="utf-8", newline="\n").write(json.dumps(m, indent=2, ensure_ascii=False) + "\n")
          EOF
            NEW_VERSION=$(python -c "import json;print(json.load(open('.claude-plugin/plugin.json'))['version'])")
          fi
          UPSTREAM=$(python -c "import json;m=json.load(open('.claude-plugin/plugin.json'));print(m.get('metadata',{}).get('upstreamVersion','?'))")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "sync: hve-core ${UPSTREAM} (plugin v${NEW_VERSION})"
          git push
